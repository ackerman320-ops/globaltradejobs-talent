  .btn-nav { display: inline-flex; align-items: center; padding: 7px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; background: var(--navy); color: white; }

  .page-wrap { max-width: 860px; margin: 40px auto; padding: 0 2rem 80px; }

  .profile-title { font-size: 14px; color: var(--gray-600); margin-bottom: 8px; }
  .profile-location { font-size: 13px; color: var(--gray-400); display: flex; align-items: center; gap: 5px; }
  .certs-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .cert-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--navy); color: white; font-weight: 500; }

  /* NOT CLAIMED BOX */
  .not-claimed { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 28px 32px; margin-bottom: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 18px; }
  .not-claimed-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--gray-100); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--gray-400); }
  .not-claimed-text { font-size: 15px; color: var(--gray-600); line-height: 1.5; }

  .cta-text h2 { font-size: 18px; font-weight: 700; color: white; margin-bottom: 6px; }
  .cta-text p { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.6; max-width: 480px; }
  .cta-btn { padding: 12px 28px; background: var(--teal); color: var(--navy); border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; flex-shrink: 0; transition: background .15s; display: inline-block; }
