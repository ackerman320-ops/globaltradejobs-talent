<style>

    --gray-400: #adb5bd;
    --gray-600: #6c757d;
    --gray-800: #343a40;
    --white: #ffffff;
    --radius: 12px;
    --radius-sm: 8px;

    --shadow-md: 0 4px 12px rgba(0,0,0,0.1);

  body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }

  .btn-nav { display: inline-flex; align-items: center; padding: 7px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; text-decoration: none; background: var(--navy); color: white; }
  .btn-nav:hover { background: var(--navy-light); }
  .page-wrap { max-width: 860px; margin: 40px auto; padding: 0 2rem 80px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gray-600); text-decoration: none; margin-bottom: 24px; }

  /* PROFILE HEADER */

  .profile-name { font-size: 26px; font-weight: 700; color: white; margin-bottom: 4px; }
  .profile-title { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 6px; }
  .profile-location { font-size: 13px; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 5px; margin-bottom: 14px; }
  .linkedin-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--teal); text-decoration: none; border: 1px solid rgba(126,200,227,0.4); padding: 4px 12px; border-radius: 20px; }
  .linkedin-link:hover { background: rgba(126,200,227,0.1); }

  .section { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 24px 28px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--navy); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #eaf6fb; }
  .bio-text { font-size: 14px; color: var(--gray-600); line-height: 1.75; }
  .certs-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .cert-badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: var(--navy); color: white; font-weight: 500; }
  .skills-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-tag { font-size: 12px; padding: 4px 12px; border-radius: 20px; background: var(--gray-100); color: var(--gray-600); border: 1px solid var(--gray-200); }
  .achievement { padding: 16px; background: var(--gray-50); border-radius: var(--radius-sm); border-left: 3px solid var(--navy); margin-bottom: 12px; }
  .achievement:last-child { margin-bottom: 0; }
  .achievement-title { font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
  .achievement-desc { font-size: 13px; color: var(--gray-600); line-height: 1.6; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .meta-item-label { font-size: 11px; color: var(--gray-400); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .meta-item-value { font-size: 13px; font-weight: 500; color: var(--gray-800); }

  .not-claimed-text { font-size: 14px; color: var(--gray-600); }

  /* CTA */
  .cta-box { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); border-radius: var(--radius); padding: 28px 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; box-shadow: var(--shadow-md); }

  .cta-btn { padding: 11px 26px; background: var(--teal); color: var(--navy); border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; flex-shrink: 0; transition: background .15s; display: inline-block; }
  .cta-btn:hover { background: var(--teal-dark); }
</style>
</head>
