<title>Global Trade Network</title>

*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:600px;overflow:hidden;}
#gc{position:relative;background:#06101a;width:100%;height:600px;overflow:hidden;}
#cv{display:block;width:100%;cursor:grab;}
#cv:active{cursor:grabbing;}
#heatCanvas{position:absolute;top:0;left:0;pointer-events:none;}
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#06101a;z-index:50;}
#loader-ring{width:36px;height:36px;border:3px solid rgba(55,138,221,0.2);border-top-color:#378ADD;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#loader-txt{color:rgba(255,255,255,0.5);font-size:13px;font-family:sans-serif;}
#counter{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(6,16,26,0.8);color:white;font-size:13px;font-weight:600;padding:7px 18px;border-radius:20px;border:0.5px solid rgba(55,138,221,0.35);font-family:sans-serif;white-space:nowrap;backdrop-filter:blur(4px);}
#counter span{color:#7ec8e3;}
#legend{position:absolute;bottom:16px;right:16px;z-index:10;background:rgba(6,16,26,0.82);border:0.5px solid rgba(55,138,221,0.3);border-radius:10px;padding:10px 12px;font-family:sans-serif;backdrop-filter:blur(4px);}
#legend .leg-title{font-size:10px;font-weight:600;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;text-align:center;}
#map-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,0.65);color:rgba(255,255,255,0.9);font-size:11px;padding:6px 12px;border-radius:20px;pointer-events:none;transition:opacity 1.5s ease;font-family:sans-serif;white-space:nowrap;}
</style>
</head>

function project(lat,lng){
  const lam=(lng+rotX)*D,phi=lat*D,p0=rotY*D;
  const sp=Math.sin(phi),cp=Math.cos(phi),sp0=Math.sin(p0),cp0=Math.cos(p0),cl=Math.cos(lam);
  if(sp*sp0+cp*cp0*cl<0.01)return null;
  return[W/2+scale*(cp*Math.sin(lam)),H/2-scale*(sp*cp0-cp*sp0*cl)];
}

function drawSphere(){
  ctx.beginPath();ctx.arc(W/2,H/2,scale,0,2*Math.PI);
  ctx.fillStyle='#0b1929';ctx.fill();
  ctx.strokeStyle='rgba(55,138,221,0.3)';ctx.lineWidth=1.5;ctx.stroke();
}
function drawGrat(){
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
  for(let g=-180;g<=180;g+=30){ctx.beginPath();let f=true;for(let t=-90;t<=90;t+=4){const p=project(t,g);if(p){f?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);f=false;}else f=true;}ctx.stroke();}
  for(let t=-60;t<=60;t+=30){ctx.beginPath();let f=true;for(let g=-180;g<=180;g+=4){const p=project(t,g);if(p){f?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);f=false;}else f=true;}ctx.stroke();}
}
function drawRings(rings,fill,stroke,lw){
  rings.forEach(ring=>{
    ctx.beginPath();let f=true,pn=false;
    for(const c of ring){const p=project(c[1],c[0]);if(p){(f||pn)?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);f=false;pn=false;}else pn=true;}
    ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
  });
}

function lbl(txt,x,y,sz,alpha,bold){
  ctx.save();ctx.font=(bold?'500 ':'')+sz+'px Arial,sans-serif';
  ctx.fillStyle='rgba(170,205,240,'+alpha+')';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.95)';ctx.shadowBlur=4;ctx.fillText(txt,x,y);ctx.restore();
}

function drawHeatLayer(){
  hCtx.clearRect(0,0,W,H);

  // Clip to sphere
  hCtx.save();
  hCtx.beginPath();hCtx.arc(W/2,H/2,scale-1,0,2*Math.PI);hCtx.clip();

  // Use 'lighter' blending so overlapping blobs add up naturally
  hCtx.globalCompositeOperation='source-over';

  const sorted=[...HEATPOINTS].sort((a,b)=>a.n-b.n);
  sorted.forEach(p=>{
    const pt=project(p.lat,p.lng);if(!pt)return;
    const ratio=Math.pow(p.n/MAX_N,0.38);
    // Blob radius scales with zoom
    const z=scale/baseScale;
    const R=Math.max(15,Math.min(80,ratio*80+10))*(z*0.2+0.8);

    const grad=hCtx.createRadialGradient(pt[0],pt[1],0,pt[0],pt[1],R);

    // Classic heat map: red->orange->yellow->green->teal->blue->transparent
    if(ratio>0.7){
      grad.addColorStop(0,  `rgba(255,255,200,${(ratio*0.9).toFixed(2)})`);
      grad.addColorStop(0.1,`rgba(255,50,0,${(ratio*0.85).toFixed(2)})`);
      grad.addColorStop(0.25,`rgba(255,120,0,${(ratio*0.7).toFixed(2)})`);
      grad.addColorStop(0.45,`rgba(255,200,0,${(ratio*0.5).toFixed(2)})`);
      grad.addColorStop(0.65,`rgba(0,200,100,${(ratio*0.3).toFixed(2)})`);
      grad.addColorStop(0.82,`rgba(11,138,221,${(ratio*0.15).toFixed(2)})`);
      grad.addColorStop(1,  'rgba(6,16,26,0)');
    } else if(ratio>0.35){
      grad.addColorStop(0,  `rgba(255,120,0,${(ratio*0.8).toFixed(2)})`);
      grad.addColorStop(0.25,`rgba(255,200,0,${(ratio*0.6).toFixed(2)})`);
      grad.addColorStop(0.5,`rgba(0,200,100,${(ratio*0.35).toFixed(2)})`);
      grad.addColorStop(0.75,`rgba(11,138,221,${(ratio*0.15).toFixed(2)})`);
      grad.addColorStop(1,  'rgba(6,16,26,0)');
    } else if(ratio>0.12){
      grad.addColorStop(0,  `rgba(255,200,0,${(ratio*0.7).toFixed(2)})`);
      grad.addColorStop(0.35,`rgba(0,200,100,${(ratio*0.4).toFixed(2)})`);
      grad.addColorStop(0.65,`rgba(11,138,221,${(ratio*0.2).toFixed(2)})`);
      grad.addColorStop(1,  'rgba(6,16,26,0)');
    } else {
      grad.addColorStop(0,  `rgba(0,180,200,${(ratio*0.6).toFixed(2)})`);
      grad.addColorStop(0.5,`rgba(11,80,140,${(ratio*0.2).toFixed(2)})`);
      grad.addColorStop(1,  'rgba(6,16,26,0)');
    }

    hCtx.beginPath();hCtx.arc(pt[0],pt[1],R,0,2*Math.PI);
    hCtx.fillStyle=grad;hCtx.fill();
  });

  hCtx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawSphere();drawGrat();
  countries.forEach(c=>drawRings(c.rings,'#1a3048',null,0));
  countries.forEach(c=>drawRings(c.rings,null,'rgba(90,155,215,0.45)',0.7));
  stateBorders.forEach(r=>drawRings([r],null,'rgba(90,155,215,0.22)',0.4));
  drawHeatLayer();
  const z=scale/baseScale;
  CLABELS.forEach(c=>{
    const p=project(c.lat,c.lng);if(!p)return;
    const t=c.t||2,minZ=t===1?0:t===2?0.65:t===3?1.2:1.8;if(z<minZ)return;
    const a=Math.min(0.75,(z-minZ)*1.5+(t===1?0.35:0));if(a<0.06)return;
    lbl(c.n.toUpperCase(),p[0],p[1],Math.max(8,Math.min(11,6.5+z*2)),a,true);
  });


}

function resize(){
  W=window.innerWidth;H=600;
  canvas.width=W;canvas.height=H;canvas.style.height=H+'px';
  heatCanvas.width=W;heatCanvas.height=H;heatCanvas.style.height=H+'px';
  baseScale=Math.min(W,H)*0.43;if(!scale)scale=baseScale;
  if(countries.length)draw();
}

canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(baseScale*0.4,Math.min(baseScale*10,scale*(e.deltaY<0?1.25:0.8)));draw();},{passive:false});
canvas.addEventListener('dblclick',()=>{scale=Math.max(baseScale*0.4,Math.min(baseScale*10,scale*1.5));draw();});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();scale=Math.max(baseScale*0.4,Math.min(baseScale*10,scale*0.7));draw();});
canvas.addEventListener('mousedown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mousemove',e=>{if(!dragging)return;rotX-=(e.clientX-lx)*0.35;rotY-=(e.clientY-ly)*0.35;rotY=Math.max(-85,Math.min(85,rotY));lx=e.clientX;ly=e.clientY;draw();});
window.addEventListener('mouseup',()=>dragging=false);
let lastPinchDist=null;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}else if(e.touches.length===2){dragging=false;lastPinchDist=null;}},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,dist=Math.sqrt(dx*dx+dy*dy);if(lastPinchDist){scale=Math.max(baseScale*0.4,Math.min(baseScale*10,scale*(dist/lastPinchDist)));draw();}lastPinchDist=dist;return;}
  if(!dragging||e.touches.length!==1)return;
  rotX-=(e.touches[0].clientX-lx)*0.35;rotY-=(e.touches[0].clientY-ly)*0.35;rotY=Math.max(-85,Math.min(85,rotY));lx=e.touches[0].clientX;ly=e.touches[0].clientY;draw();e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',()=>{dragging=false;lastPinchDist=null;});
window.addEventListener('resize',resize);

resize();
setTimeout(()=>{const h=document.getElementById('map-hint');if(h)h.style.opacity='0';},6000);
setTimeout(()=>{const h=document.getElementById('map-hint');if(h)h.style.display='none';},8000);

(async()=>{
  try{
    const [r1,r2]=await Promise.all([
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'),
      fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
    ]);
    const [w,us]=await Promise.all([r1.json(),r2.json()]);
    function decode(topo,obj){
      const sc=topo.transform?topo.transform.scale:[1,1],tr=topo.transform?topo.transform.translate:[0,0];
      const decoded=topo.arcs.map(arc=>{let x=0,y=0;return arc.map(d=>{x+=d[0];y+=d[1];return[x*sc[0]+tr[0],y*sc[1]+tr[1]];});});
      function ring(idxs){const coords=[];for(let i of idxs){const rev=i<0;const arc=decoded[rev?~i:i];const pts=rev?[...arc].reverse():arc;for(let j=rev?0:1;j<pts.length;j++)coords.push(pts[j]);}return coords;}
      return obj.geometries.map(g=>{const rings=[];if(g.type==='Polygon')rings.push(ring(g.arcs[0]));else if(g.type==='MultiPolygon')g.arcs.forEach(p=>rings.push(ring(p[0])));return rings;});
    }
    countries=decode(w,w.objects.countries).map(rings=>({rings}));
    stateBorders=decode(us,us.objects.states).flat();
    document.getElementById('loader').style.display='none';
    draw();
  }catch(e){
    document.getElementById('loader-txt').textContent='Ready';
    setTimeout(()=>document.getElementById('loader').style.display='none',500);
    draw();
  }
})();
</script>
</body>
</html>
