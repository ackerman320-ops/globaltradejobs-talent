let activeProf=null,W,H,scale,baseScale,rotX=20,rotY=20,dragging=false,lx=0,ly=0;

const canvas=document.getElementById('cv');

const ctx=canvas.getContext('2d');
const D=Math.PI/180;

function project(lat,lng){
  const lam=(lng+rotX)*D,phi=lat*D,p0=rotY*D;
  const sp=Math.sin(phi),cp=Math.cos(phi),sp0=Math.sin(p0),cp0=Math.cos(p0),cl=Math.cos(lam);
  if(sp*sp0+cp*cp0*cl<0.01)return null;
  return[W/2+scale*(cp*Math.sin(lam)),H/2-scale*(sp*cp0-cp*sp0*cl)];
}

function drawSphere(){
  ctx.beginPath();ctx.arc(W/2,H/2,scale,0,2*Math.PI);
  ctx.fillStyle='#0b1929';ctx.fill();
  ctx.strokeStyle='rgba(55,138,221,0.3)';ctx.lineWidth=1.5;ctx.stroke();
}

function drawGrat(){
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
  for(let g=-180;g<=180;g+=30){ctx.beginPath();let f=true;for(let t=-90;t<=90;t+=4){const p=project(t,g);if(p){f?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);f=false;}else f=true;}ctx.stroke();}
  for(let t=-60;t<=60;t+=30){ctx.beginPath();let f=true;for(let g=-180;g<=180;g+=4){const p=project(t,g);if(p){f?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);f=false;}else f=true;}ctx.stroke();}
}

function drawRings(rings,fill,stroke,lw){
  rings.forEach(ring=>{
    ctx.beginPath();let f=true,pn=false;
    for(const c of ring){
      const p=project(c[1],c[0]);
      if(p){(f||pn)?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);f=false;pn=false;}
      else pn=true;
    }
    ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
  });
}

function lbl(txt,x,y,sz,alpha,bold){
  ctx.save();ctx.font=(bold?'500 ':'')+sz+'px -apple-system,Arial,sans-serif';
  ctx.fillStyle='rgba(170,205,240,'+alpha+')';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.95)';ctx.shadowBlur=4;ctx.fillText(txt,x,y);ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawSphere();drawGrat();
  countries.forEach(c=>drawRings(c.rings,'#1a3048',null,0));
  countries.forEach(c=>drawRings(c.rings,null,'rgba(90,155,215,0.45)',0.7));
  stateBorders.forEach(r=>drawRings([r],null,'rgba(90,155,215,0.22)',0.4));
  const z=scale/baseScale;
  CLABELS.forEach(c=>{
    const p=project(c.lat,c.lng);if(!p)return;
    const t=c.t||2,minZ=t===1?0:t===2?0.65:t===3?1.2:1.8;
    if(z<minZ)return;
    const a=Math.min(0.75,(z-minZ)*1.5+(t===1?0.35:0));
    if(a<0.06)return;
    lbl(c.n.toUpperCase(),p[0],p[1],Math.max(8,Math.min(11,6.5+z*2)),a,true);
  });
  renderPins();
}

function renderPins(){
  document.querySelectorAll('.pin').forEach(p=>p.remove());
  profs.forEach(p=>{
    const pt=project(p.lat,p.lng);if(!pt)return;
    const pin=document.createElement('div');
    pin.className='pin';
    pin.style.cssText='position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:6;left:'+pt[0]+'px;top:'+pt[1]+'px;';
    const bub=document.createElement('div');
    bub.style.cssText='width:38px;height:38px;border-radius:50%;background:rgba(8,18,32,0.88);border:2px solid rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 14px rgba(0,0,0,0.75);transition:transform 0.15s;';
    bub.textContent=p.emoji;
    bub.onmouseover=()=>bub.style.transform='scale(1.18)';
    bub.onmouseout=()=>bub.style.transform='scale(1)';
    pin.appendChild(bub);
    pin.onclick=(e)=>{e.stopPropagation();showCard(p,pt);};
    pin.addEventListener('touchend',(e)=>{e.preventDefault();e.stopPropagation();showCard(p,pt);},{passive:false});
    gc.appendChild(pin);
  });
}

function showCard(p,pt){
  activeProf=p;
  document.getElementById('cav').textContent=p.emoji;
  document.getElementById('cnm').textContent=p.name;
  document.getElementById('ctl').textContent=p.title;
  document.getElementById('cloc').textContent=p.city+', '+p.country;
  document.getElementById('cexp').textContent=p.exp;
  document.getElementById('cavl').textContent=p.avail;
  const certsHtml=p.certs.map(c=>'<span class="cb">'+c+'</span>').join('');document.getElementById('ccerts').innerHTML=certsHtml;document.getElementById('ccerts').style.display=certsHtml?'flex':'none';
  const card=document.getElementById('card');
  const rect=canvas.getBoundingClientRect();
  let lft=rect.left+pt[0]+22, top=rect.top+pt[1]-20;
  const vw=window.innerWidth, vh=window.innerHeight;
  if(lft+252>vw)lft=rect.left+pt[0]-264;
  if(top+250>vh)top=vh-258;
  if(top<8)top=8; if(lft<8)lft=8;
  card.style.left=lft+'px';card.style.top=top+'px';card.classList.add('on');
}
function closeCard(){document.getElementById('card').classList.remove('on');activeProf=null;}
function openProfile(){if(activeProf)window.open(BASE+activeProf.slug,'_blank');}
function openLinkedIn(){window.open('https://www.linkedin.com/','_blank');}

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;canvas.style.height=H+'px';
  baseScale=Math.min(W,H)*0.43;if(!scale)scale=baseScale;
  if(countries.length)draw();
}

canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(baseScale*0.4,Math.min(baseScale*10,scale*(e.deltaY<0?1.25:0.8)));draw();},{passive:false});
canvas.addEventListener('dblclick',e=>{scale=Math.max(baseScale*0.4,Math.min(baseScale*10,scale*1.5));draw();});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();scale=Math.max(baseScale*0.4,Math.min(baseScale*10,scale*0.7));draw();});
canvas.addEventListener('mousedown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mousemove',e=>{if(!dragging)return;rotX-=(e.clientX-lx)*0.35;rotY-=(e.clientY-ly)*0.35;rotY=Math.max(-85,Math.min(85,rotY));lx=e.clientX;ly=e.clientY;draw();});
window.addEventListener('mouseup',()=>dragging=false);
canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}},{passive:true});
canvas.addEventListener('touchmove',e=>{if(!dragging||e.touches.length!==1)return;rotX-=(e.touches[0].clientX-lx)*0.35;rotY-=(e.touches[0].clientY-ly)*0.35;rotY=Math.max(-85,Math.min(85,rotY));lx=e.touches[0].clientX;ly=e.touches[0].clientY;draw();e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',()=>{dragging=false;lastPinchDist=null;});
let lastPinchDist=null;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){dragging=false;lastPinchDist=null;}},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(lastPinchDist){scale=Math.max(baseScale*0.4,Math.min(baseScale*10,scale*(dist/lastPinchDist)));draw();}
    lastPinchDist=dist;
  }
},{passive:false});
gc.addEventListener('click',e=>{if(e.target===canvas)closeCard();});
window.addEventListener('resize',resize);

resize();
(async()=>{
  try{
    const [r1,r2]=await Promise.all([
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'),
      fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
    ]);
    const [w,us]=await Promise.all([r1.json(),r2.json()]);
    function decode(topo,obj){
      const arcs=topo.arcs;
      const sc=topo.transform?topo.transform.scale:[1,1];
      const tr=topo.transform?topo.transform.translate:[0,0];
      const decoded=arcs.map(arc=>{let x=0,y=0;return arc.map(d=>{x+=d[0];y+=d[1];return[x*sc[0]+tr[0],y*sc[1]+tr[1]];});});
      function ring(idxs){
        const coords=[];
        for(let i of idxs){const rev=i<0;const arc=decoded[rev?~i:i];const pts=rev?[...arc].reverse():arc;for(let j=rev?0:1;j<pts.length;j++)coords.push(pts[j]);}
        return coords;
      }
      return obj.geometries.map(g=>{
        const rings=[];
        if(g.type==='Polygon')rings.push(ring(g.arcs[0]));
        else if(g.type==='MultiPolygon')g.arcs.forEach(p=>rings.push(ring(p[0])));
        return rings;
      });
    }
    countries=decode(w,w.objects.countries).map(rings=>({rings}));
    stateBorders=decode(us,us.objects.states).flat();
    document.getElementById('loader').style.display='none';
    draw();
  }catch(e){
    document.getElementById('loader-txt').textContent='Ready';
    setTimeout(()=>document.getElementById('loader').style.display='none',500);
    draw();
  }
})();
setTimeout(()=>{const h=document.getElementById('map-hint');if(h)h.style.opacity='0';},6000);
setTimeout(()=>{const h=document.getElementById('map-hint');if(h)h.style.display='none';},8000);
